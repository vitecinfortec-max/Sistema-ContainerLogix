# Roda a cada push/PR no main: testes do backend e build do frontend.
# O Render está configurado para só publicar depois que estas verificações
# passarem ("Auto-Deploy: After CI Checks Pass") - um commit quebrado não
# chega aos clientes.
name: Testes

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt -r requirements-dev.txt

      # Os testes usam um Mongo em memória (mongomock) - não precisam de banco
      # nem de servidor no ar. Nenhum segredo de produção é usado aqui.
      - name: Rodar testes
        run: python -m pytest tests -q
        env:
          JWT_SECRET_KEY: somente-para-ci

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Instalar dependências
        run: yarn install --frozen-lockfile --network-timeout 600000

      # Mesmo comando da Vercel (frontend/vercel.json)
      - name: Build
        run: yarn build
        env:
          CI: 'false'
