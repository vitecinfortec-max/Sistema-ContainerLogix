services:
  - type: web
    name: containerlogix-backend
    runtime: python
    plan: starter
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/
    disk:
      name: containerlogix-uploads
      # Corresponde a UPLOADS_DIR em backend/server.py (ROOT_DIR.parent / 'uploads'),
      # ou seja, a pasta uploads/ na raiz do repo, um nível acima de backend/.
      mountPath: /opt/render/project/src/uploads
      sizeGB: 10
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Multi-cliente (ver backend/tenancy.py): MULTI_TENANT=1 liga um servidor
      # para todas as empresas; CORS_ORIGIN_REGEX libera os subdomínios delas.
      # Desligado (padrão), cada instância continua com o seu DB_NAME.
      - key: MULTI_TENANT
        sync: false
      - key: CORS_ORIGIN_REGEX
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      # Opcionais: usados para envio de e-mail (ex: recuperação de senha) via Resend.
      # Deixe em branco no Render se essa funcionalidade não for usada.
      - key: RESEND_API_KEY
        sync: false
      - key: SENDER_EMAIL
        sync: false
      # Opcional: liga a leitura do container pela foto na Auditoria de Estoque
      # e a importação de CNH/RG/CRLV nos cadastros (CONTAINER_OCR_MODEL e
      # DOCUMENT_OCR_MODEL trocam o modelo, padrão claude-opus-5-5).
      - key: ANTHROPIC_API_KEY
        sync: false
      # Opcional: emissão de CT-e/MDF-e pela Focus NFe. FOCUSNFE_TOKEN é o token
      # master da conta do dono do sistema (Painel API > Tokens); cada empresa
      # é cadastrada na tela Configuração Fiscal, com o próprio certificado A1.
      - key: FOCUSNFE_TOKEN
        sync: false
